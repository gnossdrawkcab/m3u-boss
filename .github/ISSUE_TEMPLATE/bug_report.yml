name: Bug report
description: Report a reproducible M3U Boss problem without private IPTV data.
body:
  - type: markdown
    attributes:
      value: Never attach databases, backups, playlists, provider URLs, or credentials.
  - type: input
    id: version
    attributes: { label: Version, placeholder: 0.1.0-alpha.1 }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Core Compose, Edge Compose, Manual, Other]
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Redacted logs }
